data_config: configs/norwich.yaml
runs_dir: runs
results_dir: results

window_h: 24
horizons_h: [1, 3, 6, 12]
quantiles: [0.1, 0.5, 0.9]

train:
  epochs: 25
  batch_size: 64
  samples_per_epoch: 6400  # random subset of (highly overlapping) hourly windows
  val_stride: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  patience: 5
  grad_clip: 5.0
  seed: 0

fast:  # smoke-test settings (--fast)
  epochs: 2
  max_batches: 40
  xgb_rows: 20000

lstm:
  hidden: 64
  layers: 2
  dropout: 0.1

graph_wavenet:
  channels: 24
  skip_channels: 48
  end_channels: 96
  blocks: 2
  layers: 4
  kernel: 2
  order: 2
  embed_dim: 10
  dropout: 0.3

xgboost:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  max_rows: 200000

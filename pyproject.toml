[project]
name = "rivercast"
version = "0.1.0"
description = "Physics-aware spatio-temporal GNNs for river pollution forecasting and uncertainty quantification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rivercast"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
